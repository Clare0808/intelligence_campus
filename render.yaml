services:
  - type: web
    name: intelligence-campus
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CAMPUS_DATA_DIR
        value: /data
      - key: CAMPUS_START_CONSTRUCTION_FEED
        value: "1"
      - key: CAMPUS_DISABLE_LEGACY_REFRESH
        value: "1"
      - key: CAMPUS_SESSION_SECRET
        generateValue: true
      - key: CAMPUS_ORIGIN
        sync: false